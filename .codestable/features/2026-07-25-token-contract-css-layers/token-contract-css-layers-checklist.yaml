    source: 名词契约
    status: passed
  - item: "新增公共 token 使用 --amis-* 命名空间"
    source: 名词契约
    status: passed
  - item: "旧 --colors-*、--Button* / --button-* token 映射集中治理，不在组件文件散落新增"
    source: 名词契约
    status: passed
  - item: "CSS layer 顺序固定为 amis.reset、amis.tokens、amis.components、amis.theme、amis.user"
    source: 编排骨架
    status: passed
  - item: "主题包 token 覆写通过 [data-amis-theme] 或 amis.theme 层进入"
    source: 编排骨架
    status: passed
