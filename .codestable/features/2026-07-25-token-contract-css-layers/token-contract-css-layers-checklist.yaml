feature: 2026-07-25-token-contract-css-layers
created: 2026-07-25

steps:
  - action: "微重构入口：建立 token contract 目录/入口，并保持旧 _properties.scss 导入链可用"
    exit_signal: "新增 token contract 入口可被主题入口或 _properties.scss 引入，现有组件消费点无需同步迁移"
    status: done
  - action: "契约骨架：声明 canonical CSS layer 顺序和 --amis-* token taxonomy"
    exit_signal: "SCSS fixture 或主题入口中可观察 @layer amis.reset, amis.tokens, amis.components, amis.theme, amis.user，以及 palette→semantic→component/state token 链"
    status: done
  - action: "旧 token alias：集中映射 --colors-*、--Button* / --button-* 到新 token contract"
    exit_signal: "旧 token 仍能解析，新增 alias 集中在 token contract 入口或明确允许的兼容入口，不散落到组件文件"
    status: done
  - action: "主题覆写入口：让 cxd/dark/antd/default 的 token 覆写走 [data-amis-theme] 或 amis.theme 层"
    exit_signal: "主题差异不依赖新增 .cxd-* selector，且 IE11 入口只保留静态 CSS 降级边界"
    status: done
  - action: "构建验证：补齐 stylelint/build/grep 或 fixture 检查"
    exit_signal: "核心验证命令通过；若全量 build/typecheck 有既有红灯，已记录归因并不阻断可核验契约"
    status: done
  - action: "范围收口：记录后续 selector build、component migration、editor migration 和 docs rollout 的交接边界"
    exit_signal: "implementation/QA/acceptance artifact 能反向核对本 feature 未迁移全组件、未迁移 editor/helper、未新增 SCSS legacy selector 兼容"
    status: done

