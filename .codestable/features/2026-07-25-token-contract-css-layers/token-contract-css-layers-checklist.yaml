    status: passed
  - item: "IE11 只作为静态 CSS 降级边界，不承诺动态 token 主题切换"
    source: 流程级约束
    status: passed
  - item: "挂载点仅限 token contract SCSS 入口、主题 SCSS 入口、构建/验证 fixture 和 CodeStable artifact"
